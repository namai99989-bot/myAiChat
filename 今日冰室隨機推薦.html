function pickRandomMeal() {
  const randomIndex = Math.floor(Math.random() * meals.length);
  const selected = meals[randomIndex];
  
  document.getElementById('mealCategory').innerText = selected.category;
  document.getElementById('mealName').innerText = selected.name;
  document.getElementById('mealImg').src = selected.img;
}
